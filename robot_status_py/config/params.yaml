# Node parameters, loaded by launch/robot_status.launch.py.
# Top-level keys must match the node names.
status_publisher:
  ros__parameters:
    publish_rate_hz: 1.0
    battery_drain_per_sec: 0.5
    low_battery_threshold: 20.0

drive_to_point_server:
  ros__parameters:
    distance_tolerance: 0.1
    linear_gain: 1.5
    angular_gain: 6.0
    max_linear_speed: 2.0
